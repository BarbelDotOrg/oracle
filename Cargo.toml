serde = { version = "1", features = ["derive"] }
ron = "0.12"
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = ["winit", "tokio", "wgpu"] }

[build-dependencies]
dirs = "7"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }